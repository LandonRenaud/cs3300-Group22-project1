name: Project 1 CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - closed

jobs:
  maven-tests:
    name: Maven Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: project1/pom.xml

      - name: Build and test with Maven
        working-directory: project1
        run: mvn --batch-mode --no-transfer-progress verify

  location-marker-tests:
    name: JavaScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run JavaScript tests
        run: node --experimental-default-type=module --test tests/*.test.mjs tests/task18/*.test.mjs tests/task20/*.test.mjs

  deploy:
    name: Deploy to Google App Engine
    runs-on: ubuntu-latest
    needs:
      - maven-tests
      - location-marker-tests
    # The closed event runs for both merged and unmerged PRs; deploy only merges.
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy to App Engine
        uses: google-github-actions/deploy-appengine@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          working_directory: project1
          deliverables: app.yaml
          flags: --quiet
          env_vars: |-
            GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}
            FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
            FIREBASE_DATABASE_URL=${{ secrets.FIREBASE_DATABASE_URL }}
