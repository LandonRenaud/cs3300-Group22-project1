name: Project 1 CI

on:
  pull_request:
    branches:
      - main

jobs:
  maven-tests:
    name: Maven Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: project1/pom.xml

      - name: Run Maven tests
        working-directory: project1
        run: mvn --batch-mode test

  location-marker-tests:
    name: Location Marker Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run location marker tests
        run: node --experimental-default-type=module --test tests/task18/*.test.mjs
