<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project 1 | Signed in</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">Project 1</a>
    <button class="button button-small" id="logout-button" type="button">Log out</button>
  </header>
  <main class="hero" id="signed-in-content" hidden>
    <p class="eyebrow">CS 3300</p>
    <h1>Welcome, <span id="user-email"></span>.</h1>
    <p>You’re signed in.</p>
  </main>
  <p id="page-message" role="status" aria-live="polite">Checking your sign-in...</p>
  <script type="module">
    import { getFirebaseUser } from "./js/firebase-auth.js";

    const token = sessionStorage.getItem("firebaseIdToken");
    if (!token) {
      window.location.replace("/login.html");
    } else {
      try {
        const result = await getFirebaseUser(token);
        if (!result.users?.length) throw new Error("Invalid Firebase user token.");
        document.querySelector("#user-email").textContent = result.users[0].email;
        document.querySelector("#signed-in-content").hidden = false;
        document.querySelector("#page-message").hidden = true;
      } catch {
        sessionStorage.removeItem("firebaseIdToken");
        window.location.replace("/login.html");
      }
    }

    document.querySelector("#logout-button").addEventListener("click", () => {
      sessionStorage.removeItem("firebaseIdToken");
      window.location.assign("/login.html");
    });
  </script>
</body>
</html>
