<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project 1 | Signed in</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body hidden>
  <header class="site-header">
    <a class="brand" href="/">Project 1</a>
    <button class="button button-small" id="logout-button" type="button">Log out</button>
  </header>
  <main class="hero" id="signed-in-content" hidden>
    <p class="eyebrow">CS 3300</p>
    <h1>Welcome, <span id="user-email"></span>.</h1>
    <p>You’re signed in.</p>
  </main>
  <p id="page-message" role="status" aria-live="polite">Checking your sign-in...</p>
  <script type="module">
    import { requireAuth, logOut } from "./js/auth-guard.js";

    const user = await requireAuth();
    if (user) {
      document.querySelector("#user-email").textContent = user.email;
      document.querySelector("#signed-in-content").hidden = false;
      document.querySelector("#page-message").hidden = true;
    }

    document.querySelector("#logout-button").addEventListener("click", logOut);
  </script>
</body>
</html>
