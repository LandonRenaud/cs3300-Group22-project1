<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalLens</title>
    <script src="js/map-scripts.js" defer></script>
    <script async src="https://maps.googleapis.com/maps/api/js?loading=async&key=AIzaSyDe4yp8nyLQGsHOS9wQLPMFphX5Ci81jZQ&libraries=maps,marker,places"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="map-body" hidden>
    <header class="site-header">
        <a class="brand" href="/homepage.html">LocalLens</a>
    </header>
    <main class="map-page">
        <aside class="map-sidebar">
            <section class="location-search" aria-labelledby="location-search-heading">
                <h1 id="location-search-heading">Location search</h1>
                <form class="location-input">
                    <label for="location">Location</label>
                    <input id="location" type="text" placeholder="Enter an address or place" class="map-input-location" autocomplete="street-address" required>
                    <p class="form-message location-error" role="alert" hidden></p>
                    <button type="submit" class="button map-search-button">Search</button>
                </form>
            </section>
            <section class="location-results" aria-labelledby="location-results-heading">
                <h2 id="location-results-heading">Nearby locations</h2>
                <p class="location-results-empty">Search for a location to see nearby places here.</p>
                <ol class="location-results-list"></ol>
            </section>
        </aside>
        <section class="map-panel" aria-label="Map">
            <gmp-map center="33.7756, -84.3963" zoom="13" map-id="DEMO_MAP_ID" class="google-map"></gmp-map>
        </section>
    </main>
    <script type="module">
        import { requireAuth } from "./js/auth-guard.js";
        await requireAuth();
    </script>
</body>
</html>
