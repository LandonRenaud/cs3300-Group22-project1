<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalLens</title>
    <script type="module" src="js/map-scripts.js"></script>
    <script async src="https://maps.googleapis.com/maps/api/js?loading=async&key=AIzaSyDe4yp8nyLQGsHOS9wQLPMFphX5Ci81jZQ&libraries=maps,marker,places"></script>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/location-markers.css">
</head>
<body class="map-body" hidden>
    <header class="site-header">
        <a class="brand" href="/homepage.html">LocalLens</a>
        <button class="button button-small" id="logout-button" type="button">Log out</button>
    </header>
    <main class="map-page">
        <aside class="map-sidebar">
            <section class="location-search" aria-labelledby="location-search-heading">
                <h1 id="location-search-heading">Location search</h1>
                <form class="location-input">
                    <label for="location">Location</label>
                    <input id="location" type="text" placeholder="Address, place name, or lat, lng (optional)" class="map-input-location" autocomplete="street-address">
                    <label for="place-keyword">What are you looking for?</label>
                    <input id="place-keyword" type="text" placeholder="e.g. coffee, museums, groceries" class="map-input-keyword" autocomplete="off">
                    <details class="advanced-settings">
                        <summary>Advanced Settings</summary>
                        <label for="radius">Radius (meters)</label>
                        <input id="radius" type="number" min="1" step="1" value="5000" class="map-input-radius">
                        <label for="price">Price</label>
                        <select id="price" class="map-input-price">
                            <option value="">Any price</option>
                            <option value="0">Free</option>
                            <option value="1">$</option>
                            <option value="2">$$</option>
                            <option value="3">$$$</option>
                            <option value="4">$$$$</option>
                        </select>
                        <label for="place-type">Place type</label>
                        <select id="place-type" class="map-input-place-type">
                            <option value="point_of_interest">Any place</option>
                            <option value="restaurant">Restaurant</option>
                            <option value="cafe">Cafe</option>
                            <option value="bar">Bar</option>
                            <option value="park">Park</option>
                            <option value="tourist_attraction">Tourist attraction</option>
                            <option value="supermarket">Supermarket</option>
                            <option value="shopping_mall">Shopping mall</option>
                        </select>
                        <label class="checkbox-label" for="open-now">
                            <input id="open-now" type="checkbox" class="map-input-open-now">
                            Open now
                        </label>
                        <label for="rank-by">Rank by</label>
                        <select id="rank-by" class="map-input-rank-by">
                            <option value="prominence">Prominence</option>
                            <option value="distance">Distance</option>
                        </select>
                    </details>
                    <p class="form-message location-error" role="alert" hidden></p>
                    <button type="submit" class="button map-search-button">Search</button>
                </form>
            </section>
            <section class="location-results" aria-labelledby="location-results-heading">
                <h2 id="location-results-heading">Nearby locations</h2>
                <p class="location-results-empty">Search for a location to see nearby places here.</p>
                <ol class="location-results-list"></ol>
            </section>
        </aside>
        <section class="map-panel" aria-label="Map">
            <gmp-map center="33.7756, -84.3963" zoom="13" map-id="DEMO_MAP_ID" class="google-map"></gmp-map>
            <section class="location-details" id="location-details" aria-labelledby="location-details-heading" hidden>
                <button class="location-details-close" type="button" aria-label="Close location details">&times;</button>
                <h2 id="location-details-heading"></h2>
                <p class="location-details-address" hidden></p>
                <p class="location-details-rating" hidden></p>
                <p class="location-details-types" hidden></p>
                <p class="location-details-coordinates"></p>
                <section class="location-reviews" aria-labelledby="reviews-heading">
                    <h3 id="reviews-heading">Community reviews</h3>
                    <p class="reviews-status" role="status">Select a location to view reviews.</p>
                    <ol class="reviews-list"></ol>
                    <button class="button button-small review-open-button" type="button" hidden>Write a review</button>
                    <form class="review-form" hidden>
                        <label for="review-author">Name (optional)</label>
                        <input id="review-author" name="author" type="text" maxlength="80" autocomplete="name" placeholder="Anonymous LocalLens User">
                        <label for="review-rating">Your rating</label>
                        <select id="review-rating" name="rating" required>
                            <option value="">Choose a rating</option>
                            <option value="5">5 – Excellent</option>
                            <option value="4">4 – Good</option>
                            <option value="3">3 – Average</option>
                            <option value="2">2 – Poor</option>
                            <option value="1">1 – Terrible</option>
                        </select>
                        <label for="review-comment">Your review</label>
                        <textarea id="review-comment" name="comment" maxlength="2000" rows="4" required></textarea>
                        <p class="review-form-message" role="alert" hidden></p>
                        <div class="review-form-actions">
                            <button class="button button-small" type="submit">Submit review</button>
                            <button class="review-cancel-button" type="button">Cancel</button>
                        </div>
                    </form>
                </section>
            </section>
        </section>
    </main>
    <script type="module">
        import { requireAuth, logOut } from "./js/auth-guard.js";
        document.querySelector("#logout-button").addEventListener("click", logOut);
        const user = await requireAuth();
        if (user) document.dispatchEvent(new CustomEvent("firebase-user-ready", { detail: user }));
    </script>
</body>
</html>
